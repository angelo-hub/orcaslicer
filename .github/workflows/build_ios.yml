name: Build iOS core

# Cross-compiles the slicing core (libslic3r + the mobile façade) for iOS device and
# simulator and publishes OrcaCore.xcframework.
#
# The dependency build is resumable across runs: the prefix, the ExternalProject stamps
# and the download cache are saved after every run, even a failed one, and restored on
# the next. A restored cache records the commit it was built from; the stamps of every
# recipe that changed since then are removed so those dependencies (and their
# dependents) rebuild, while untouched ones are reused.

on:
  push:
    branches: ['**']
    paths:
      - 'CMakeLists.txt'
      - 'cmake/**'
      - 'deps/**'
      - 'deps_src/**'
      - 'src/**'
      - 'version.inc'
      - 'scripts/build_ios_core.sh'
      - '.github/workflows/build_ios.yml'
  workflow_dispatch:
    inputs:
      rebuild-deps:
        description: Ignore the cached dependency prefix and rebuild it
        type: boolean
        default: false

jobs:
  core:
    name: iOS core (${{ matrix.slice }})
    runs-on: macos-15
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        slice: [device, simulator]
    env:
      DEPS_DIR: deps/build/ios-${{ matrix.slice }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          lfs: 'false'
          fetch-depth: 0

      - name: Install build tools
        run: brew install ninja

      - name: Show toolchain
        run: |
          xcodebuild -version
          cmake --version | head -1
          ninja --version

      - name: Restore dependency build
        id: deps-cache
        if: ${{ !inputs.rebuild-deps }}
        uses: actions/cache/restore@v5
        with:
          path: |
            ${{ env.DEPS_DIR }}/OrcaSlicer_dep
            ${{ env.DEPS_DIR }}/*-prefix/src/*-stamp
            ${{ env.DEPS_DIR }}/*-prefix/tmp
            ${{ env.DEPS_DIR }}/deps-cache-commit
            deps/DL_CACHE
          key: ios-deps-${{ matrix.slice }}-${{ github.run_id }}
          restore-keys: |
            ios-deps-${{ matrix.slice }}-

      - name: Invalidate changed recipes
        if: ${{ steps.deps-cache.outputs.cache-matched-key != '' }}
        run: |
          set -e
          commit_file="$DEPS_DIR/deps-cache-commit"
          if [ ! -f "$commit_file" ]; then
            echo "No commit recorded with the cache; rebuilding every dependency"
            rm -rf "$DEPS_DIR"/*-prefix
            exit 0
          fi
          base=$(cat "$commit_file")
          echo "Cache was built at $base"
          if ! git cat-file -e "$base^{commit}" 2>/dev/null; then
            echo "Commit unknown to this checkout; rebuilding every dependency"
            rm -rf "$DEPS_DIR"/*-prefix
            exit 0
          fi
          changed=$(git diff --name-only "$base" HEAD -- deps/ scripts/build_ios_core.sh)
          echo "Changed since then:"; echo "$changed"
          if echo "$changed" | grep -qE '^(deps/[^/]+\.cmake|deps/CMakeLists\.txt|scripts/build_ios_core\.sh)$'; then
            echo "Shared build settings changed; rebuilding every dependency"
            rm -rf "$DEPS_DIR"/*-prefix
            exit 0
          fi
          for recipe in $(echo "$changed" | sed -nE 's#^deps/([^/]+)/.*#\1#p' | sort -u); do
            echo "Recipe $recipe changed; its stamps are removed"
            rm -rf "$DEPS_DIR/dep_$recipe-prefix"
          done

      - name: Build dependencies
        run: ./scripts/build_ios_core.sh -d -a ${{ matrix.slice }}

      - name: Record the commit the dependency build matches
        if: always()
        run: |
          mkdir -p "$DEPS_DIR"
          git rev-parse HEAD > "$DEPS_DIR/deps-cache-commit"

      - name: Save dependency build
        if: always()
        uses: actions/cache/save@v5
        with:
          path: |
            ${{ env.DEPS_DIR }}/OrcaSlicer_dep
            ${{ env.DEPS_DIR }}/*-prefix/src/*-stamp
            ${{ env.DEPS_DIR }}/*-prefix/tmp
            ${{ env.DEPS_DIR }}/deps-cache-commit
            deps/DL_CACHE
          key: ios-deps-${{ matrix.slice }}-${{ github.run_id }}

      - name: Build core
        run: ./scripts/build_ios_core.sh -s -a ${{ matrix.slice }} -x

      - name: Upload slice
        uses: actions/upload-artifact@v6
        with:
          name: orca-core-ios-${{ matrix.slice }}
          path: build/ios-xcframework
          if-no-files-found: error

  xcframework:
    name: OrcaCore.xcframework
    needs: core
    runs-on: macos-15
    steps:
      - name: Download slices
        uses: actions/download-artifact@v7
        with:
          pattern: orca-core-ios-*
          path: slices

      - name: Create XCFramework
        run: |
          set -e
          args=()
          for slice in device simulator; do
            lib="slices/orca-core-ios-$slice/libOrcaCore-$slice.a"
            test -f "$lib"
            args+=(-library "$lib" -headers "slices/orca-core-ios-$slice/include")
          done
          rm -rf out && mkdir out
          xcodebuild -create-xcframework "${args[@]}" -output out/OrcaCore.xcframework
          du -sh out/OrcaCore.xcframework

      - name: Upload XCFramework
        uses: actions/upload-artifact@v6
        with:
          name: OrcaCore.xcframework
          path: out/OrcaCore.xcframework
          if-no-files-found: error
